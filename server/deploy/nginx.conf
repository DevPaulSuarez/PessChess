# Sitio de nginx para PessChess.
#
# Se añade al nginx que ya está sirviendo apiatom.devpess.com; no toca nada de
# lo que ya funciona, es un servidor virtual más.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pesschess
#   sudo ln -s /etc/nginx/sites-available/pesschess /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Y después el certificado, con el certbot que ya usas:
#   sudo certbot --nginx -d ajedrez.devpess.com
#
# Antes hay que crear el registro DNS de tipo A:
#   ajedrez.devpess.com  ->  51.79.66.133

server {
    listen 80;
    listen [::]:80;
    server_name ajedrez.devpess.com;

    # Certbot reescribirá este bloque para redirigir a HTTPS al instalar el
    # certificado. Hasta entonces sirve para que pueda validar el dominio.
    location / {
        proxy_pass http://127.0.0.1:3100;

        # Sin estas tres líneas nginx no deja pasar de HTTP a WebSocket y la
        # app se queda intentando conectar para siempre, sin error claro. Es el
        # fallo más habitual al poner nginx por delante de socket.io.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una partida puede pasar minutos sin tráfico mientras alguien piensa.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
